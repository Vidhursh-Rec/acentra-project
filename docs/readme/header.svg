<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="CareBridge: From Discharge to Recovery">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#16a34a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: "Inter", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .chip text { font-size: 15px; font-weight: 600; fill: #dcfce7; }
      @keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.08); } 24% { transform: scale(1); } }
      .heart { transform-box: fill-box; transform-origin: center; animation: beat 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .heart { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="230" cy="170" r="190" fill="url(#glow)"/>

  <!-- heart-pulse mark -->
  <g transform="translate(150 90) scale(6.6)" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <g class="heart">
      <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
      <path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27" stroke="#4ade80"/>
    </g>
  </g>

  <text class="t" x="400" y="160" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-3">CareBridge</text>
  <circle cx="410" cy="203" r="6" fill="#16a34a"/>
  <text class="t" x="426" y="211" font-size="26" fill="#ffffff" fill-opacity="0.78">From Discharge to Recovery</text>
  <text class="t" x="400" y="252" font-size="18" fill="#9ca3af">A discharge summary becomes a doctor-approved follow-up plan for patients and families.</text>

  <!-- stack chips -->
  <g class="chip" transform="translate(400 280)">
    <rect width="96" height="34" rx="17" fill="#16a34a" fill-opacity="0.25" stroke="#16a34a"/><text x="48" y="22" text-anchor="middle" class="t">FastAPI</text>
    <rect x="106" width="128" height="34" rx="17" fill="#16a34a" fill-opacity="0.25" stroke="#16a34a"/><text x="170" y="22" text-anchor="middle" class="t">Expo SDK 58</text>
    <rect x="244" width="128" height="34" rx="17" fill="#16a34a" fill-opacity="0.25" stroke="#16a34a"/><text x="308" y="22" text-anchor="middle" class="t">React + Vite</text>
    <rect x="382" width="108" height="34" rx="17" fill="#16a34a" fill-opacity="0.25" stroke="#16a34a"/><text x="436" y="22" text-anchor="middle" class="t">Supabase</text>
    <rect x="500" width="134" height="34" rx="17" fill="#16a34a" fill-opacity="0.25" stroke="#16a34a"/><text x="567" y="22" text-anchor="middle" class="t">gpt-oss-120b</text>
    <rect x="644" width="136" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.35"/><text x="712" y="22" text-anchor="middle" class="t" style="fill:#ffffff">EN · TA · HI</text>
  </g>
</svg>
